<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nido del Cardenal — Arte</title>

  <style>
    :root {
      --bg: #f5efe6;
      --bg-alt: #f1e4d4;
      --text: #3b2f2a;
      --muted: #7d6a5b;
      --accent: #c99a5b;
      --accent-soft: #e0b980;
      --radius-lg: 18px;
      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Header */
    .site-header {
      background: linear-gradient(to bottom, #f7f0e5, #f3e7d9);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      padding: 1rem 0;
    }

    .header-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    .logo-img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      border-radius: 50%;
      background: #fff;
      box-shadow: var(--shadow-soft);
    }

    h1 {
      margin: 0.2rem 0 0;
      font-size: 1.4rem;
      text-align: center;
    }

    .btn-primary, .btn-secondary {
      display: inline-block;
      text-decoration: none;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.15s;
      text-align: center;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-secondary {
      border: 1px solid var(--accent-soft);
      color: var(--text);
      background: transparent;
    }

    .btn-primary:hover,
    .btn-secondary:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-soft);
    }

    /* HERO */
    .hero {
      padding: 0.8rem 0 0.4rem;
      text-align: center;
    }

    .hero-text {
      background: rgba(255,255,255,0.45);
      border-radius: var(--radius-lg);
      padding: 0.6rem 1rem;
      max-width: 620px;
      margin: 0 auto;
    }

    .hero-text h2 {
      font-size: 1.2rem;
      margin: 0 0 0.3rem;
    }

    .artists {
      background: var(--bg-alt);
